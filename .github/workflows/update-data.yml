name: Update BTC Supply in Profit

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install requests

      - name: Обновить данные Supply in Profit
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_data.py

      - name: Обновить данные UTXO in Profit
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_utxo_in_profit.py

      - name: Обновить данные STH SOPR
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_sth_sopr.py

      - name: Обновить данные NUPL
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_nupl.py

      - name: Обновить данные MVRV Z-Score
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_mvrv_zscore.py

      - name: Сохранить данные в репозиторий
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Обновление данных Bitcoin-метрик"
          file_pattern: "data/*.json"
