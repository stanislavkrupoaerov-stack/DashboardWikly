name: Update BTC Supply in Profit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Обновить данные Supply in Profit %
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_supply_in_profit.py

      - name: Обновить данные Number of UTXOs in Profit %
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_utxos_in_profit.py

      - name: Обновить данные Short-Term Holder SOPR
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_short_term_holder_sopr.py

      - name: Обновить данные NUPL
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_nupl.py

      - name: Обновить данные MVRV Z-Score
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_mvrv_z_score.py

      - name: Обновить данные Long-Term Holder SOPR
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_long_term_holder_sopr.py

      - name: Пауза перед Fear & Greed Index
        run: sleep 20

      - name: Обновить данные Fear & Greed Index
        run: python scripts/update_fear_greed.py

      - name: Зафиксировать обновлённые данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновить данные Bitcoin-метрик"
          git push
