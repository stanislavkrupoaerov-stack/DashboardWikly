name: Update BTC Supply in Profit

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Обновить данные
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_data.py

      - name: Сохранить данные в репозиторий
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Обновление данных Supply in Profit"
          file_pattern: "data/*.json"
