name: Update BTC Supply in Profit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install requests

      - name: Обновить данные Supply in Profit
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_data.py

      - name: Пауза перед следующим запросом
        run: sleep 20

      - name: Обновить данные UTXO in Profit
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_utxo_in_profit.py

      - name: Пауза перед следующим запросом
        run: sleep 20

      - name: Обновить данные STH SOPR
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_sth_sopr.py

      - name: Пауза перед следующим запросом
        run: sleep 20

      - name: Обновить данные NUPL
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_nupl.py

      - name: Пауза перед следующим запросом
        run: sleep 20

      - name: Обновить данные MVRV Z-Score
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_mvrv_zscore.py

      - name: Пауза перед следующим запросом
        run: sleep 20

      - name: Обновить данные LTH SOPR
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_lth_sopr.py

      - name: Сохранить обновлённые данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Обновление Bitcoin-метрик" || echo "Нет изменений для сохранения"
          git push
