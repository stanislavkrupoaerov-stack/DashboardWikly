name: Update BTC Supply in Profit

on:
  schedule:
    # 06:05 UTC = 09:05 МСК ежедневно
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-btc-supply-in-profit
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Диагностика запуска
        run: |
          echo "Время запуска UTC: $(date -u)"
          echo "Ветка: $GITHUB_REF_NAME"
          git log -1 --format='Последний коммит: %h %ad %s' --date=iso

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Обновить данные Bitcoin-метрик
        env:
          BITCOIN_DATA_API_TOKEN: ${{ secrets.BITCOIN_DATA_API_TOKEN }}
        run: python scripts/update_data.py

      - name: Пауза перед Fear & Greed Index
        run: sleep 20

      - name: Обновить данные Fear & Greed Index
        run: python scripts/update_fear_greed.py

      - name: Проверить изменения
        run: |
          echo "Изменённые файлы:"
          git status --short
          git diff --stat

      - name: Зафиксировать обновлённые данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновить данные Bitcoin-метрик"
          git push
